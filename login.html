<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CAMPLINK — Connexion</title>


  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root{
      --color-primary:#2F6B3A;   
      --color-accent:#7FB069;    
      --color-sky:#89C2D9;    
      --color-bg:#F7F5F1;        
      --color-text:#213028;      
      --color-error:#E63946;     
    }

    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:sans-serif;
      background:var(--color-bg);
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
    }

    .login-card{
      background:white;
      max-width:420px;
      width:90%;
      border-radius:12px;
      box-shadow:0 6px 20px rgba(33,48,40,0.08);
      padding:32px;
    }

    .logo{
      font-family:"DM Serif Display", serif;
      font-size:28px;
      color:var(--color-primary);
      margin-bottom:16px;
      display:block;
      text-align:center;
    }

    h2{
      font-family:"DM Serif Display", serif;
      font-size:32px;
      text-align:center;
      margin:0 0 24px;
      color:var(--color-text);
    }

    form{
      display:flex;
      flex-direction:column;
      gap:16px;
    }

    label{
      font-size:14px;
      margin-bottom:4px;
      color:var(--color-text);
    }

    input{
      padding:12px 14px;
      font-size:16px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      transition:border 0.2s;
    }


  
    .error{
      border:1.5px solid var(--color-error);
    }

    .error-message{
      font-size:13px;
      color:var(--color-error);
      margin-top:-12px;
      margin-bottom:8px;
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:14px;
    }

    .options a{
      color:var(--color-accent);
      text-decoration:none;
    }

    .btn-primary{
      padding:12px;
      background:var(--color-primary);
      color:white;
      border:none;
      border-radius:8px;
      font-size:16px;
      cursor:pointer;
      transition:background 0.2s;
    }


    .signup-text{
      text-align:center;
      font-size:14px;
      margin-top:16px;
    }
    .signup-text a{
      color:var(--color-accent);
      text-decoration:none;
      font-weight:bold;
    }

 
    @media(max-width:480px){
      .login-card{ padding:24px; }
      h2{ font-size:28px; }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <span class="logo">CAMPLINK</span>
    <h2>Connexion</h2>
    
    <form>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Votre email" required>
        <div class="error-message" style="display:none;">Email invalide</div>
      </div>

      <div>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Votre mot de passe" required>
        <div class="error-message" style="display:none;">Mot de passe requis</div>
      </div>

      <div class="options">
        <label><input type="checkbox"> Se souvenir de moi</label>
        <a href="#">Mot de passe oublié ?</a>
      </div>

    <a href="categories.html" style="text-decoration: none; color: wheat; border:2px #2F6B3A solid ; width: 350px; padding: 15px;; text-align: center; background-color: #2F6B3A; border-radius: 30px; ">Connexion</a>
    </form>

    <div class="signup-text">
      Pas de compte ? <a href="signup.html">Créer un compte</a>
    </div>
  </div>

</body>
</html>
