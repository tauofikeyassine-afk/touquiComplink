<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CAMPLINK — Écran d’accueil</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    :root{
      --color-primary:#2F6B3A;
      --color-accent:#7FB069;
      --color-secondary:#D9C59A;
      --color-sky:#89C2D9;
      --color-earth:#8B5E3C;
      --color-bg:#F7F5F1;
      --color-text:#213028;
      --white-light:#F7F5F1;
    }

    *{box-sizing:border-box;}
    html,body{height:100%; margin:0; font-family:Inter, sans-serif; background:var(--color-bg); color:var(--color-text);}


    .splash{
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:24px;
      z-index:999;
    }

    .splash__bg{
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(180deg, rgba(0,0,0,0.25), rgba(0,0,0,0.15)),
        url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop");
      background-size:cover;
      background-position:center;
      filter:contrast(1.02) saturate(1.05);
      z-index:0;
    }

    .splash__inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .brand{
      color:var(--white-light);
      font-family:"DM Serif Display", serif;
      font-size:48px;
      text-shadow:0 6px 20px rgba(0,0,0,0.35);
      margin:0;
    }

    .subtitle{
      color:#fff;
      font-family:"DM Serif Display", serif;
      font-size:22px;
      text-shadow:0 6px 20px rgba(0,0,0,0.28);
      margin:0;
    }

    .btn-start{
      margin-top:24px;
      padding:14px 32px;
      font-size:18px;
      font-family:"DM Serif Display", serif;
      color:#fff;
      background:var(--color-primary);
      border:none;
      border-radius:16px;
      cursor:pointer;
      text-decoration:none;
    }

    .wave{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      line-height:0;
      z-index:1;
    }

    .wave svg{ width:100%; height:120px; display:block; }
  </style>
</head>
<body>

  <div class="splash">
    <div class="splash__bg"></div>

    <div class="splash__inner">
      <h1 class="brand">CAMPLINK</h1>
      <h3 class="subtitle">Trouvez votre prochaine aventure &amp; sortie camping</h3>
      <a href="landing.html" class="btn-start">Commencer</a>
    </div>

    

</body>
</html>
