<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMPLINK — Accueil</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "DM Serif Display", serif;
    }

    .splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-image: url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?q=80&w=2000&auto=format&fit=crop");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .content {
      background: rgba(0, 0, 0, 0.4);
      padding: 40px;
      border-radius: 20px;
      color: white;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    h3 {
      font-size: 22px;
      margin-bottom: 25px;
    }

    .btn-start {
      padding: 14px 30px;
      font-size: 18px;
      background-color: #2F6B3A;
      color: white;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }

    .btn-start:hover {
      background-color: #24562e;
    }
  </style>
</head>

<body>

  <div class="splash">
    <div class="content">
      <h1>CAMPLINK</h1>
      <h3>Trouvez votre prochaine aventure & sortie camping</h3>
      <a href="landing.html" class="btn-start">Commencer</a>
    </div>
  </div>

</body>
</html>
