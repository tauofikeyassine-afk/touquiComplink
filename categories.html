<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAMPLINK - Catégories</title>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f5f1;
      color: #213028;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 90%;
      max-width: 1100px;
      margin: auto;
      padding: 30px 0;
    }

    h1 {
      font-family: "DM Serif Display", serif;
      text-align: center;
      margin-bottom: 30px;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      width: calc(50% - 10px);
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      padding: 15px;
    }

    .overlay h2 {
      margin: 0;
      font-family: "DM Serif Display", serif;
      font-size: 26px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Choisissez le type de sortie</h1>

    <div class="grid">

      <a href="choixCategorie.html" class="card">
        <img src="plage.jpg" alt="Plage">
        <div class="overlay">
          <h2>Plage</h2>
        </div>
      </a>

      <a href="choixCategorie.html" class="card">
        <img src="montagne.jpg" alt="Montagne">
        <div class="overlay">
          <h2>Montagnes</h2>
        </div>
      </a>

      <a href="choixCategorie.html" class="card">
        <img src="foret.jpg" alt="Forêt">
        <div class="overlay">
          <h2>Forêt</h2>
        </div>
      </a>

      <a href="choixCategorie.html" class="card">
        <img src="desert.jpg" alt="Désert">
        <div class="overlay">
          <h2>Désert</h2>
        </div>
      </a>

    </div>
  </div>

</body>
</html>
